<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Email Spoofer — Samarth Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #09090b;
            color: #fafafa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Premium Animated Background */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            will-change: transform;
        }

        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -10%;
            right: -5%;
            background: #ff0080;
            animation: orbFloat1 25s ease-in-out infinite;
        }

        .orb:nth-child(2) {
            width: 350px;
            height: 350px;
            bottom: -10%;
            left: -5%;
            background: #8b5cf6;
            animation: orbFloat2 30s ease-in-out infinite;
        }

        .orb:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #00ccff;
            animation: orbFloat3 20s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(-60px, 40px) scale(1.2);
            }
            66% {
                transform: translate(40px, -60px) scale(0.8);
            }
        }

        @keyframes orbFloat2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.3);
            }
            66% {
                transform: translate(-40px, 50px) scale(0.7);
            }
        }

        @keyframes orbFloat3 {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        /* Grid overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 0 4px;
        }

        /* Premium Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding: 0 8px;
        }

        .badge-wrap {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 100px;
            font-size: 10px;
            font-weight: 600;
            color: #a78bfa;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }

        .badge .dot-live {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
            display: inline-block;
            animation: blinkLive 1.2s ease-in-out infinite;
        }

        @keyframes blinkLive {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        .badge.pro {
            background: rgba(255, 0, 128, 0.12);
            border-color: rgba(255, 0, 128, 0.15);
            color: #ff6b9d;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ff0080, #ff6b00, #ffcc00, #00ff88, #00ccff, #8b5cf6, #ff0080);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            text-shadow: none;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .tagline {
            font-size: 15px;
            color: #8a8f98;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .tagline span {
            color: #ffcc00;
            font-weight: 600;
        }

        .divider-premium {
            width: 48px;
            height: 3px;
            margin: 14px auto 10px;
            background: linear-gradient(90deg, #ff0080, #8b5cf6);
            border-radius: 10px;
        }

        .edition-text {
            font-size: 11px;
            font-weight: 700;
            color: #8b5cf6;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Premium Card */
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 28px 22px 24px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: border-color 0.4s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.2), transparent);
        }

        .card:hover {
            border-color: rgba(139, 92, 246, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #fafafa;
        }

        .card-title .icon {
            font-size: 18px;
        }

        .card-title .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
            display: inline-block;
            animation: blinkLive 1.2s ease-in-out infinite;
        }

        .card-badge {
            font-size: 10px;
            font-weight: 600;
            color: #5a5f66;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 100px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Counter */
        .counter-wrap {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 255, 136, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(0, 255, 136, 0.04);
        }

        .counter-wrap .num {
            font-size: 28px;
            font-weight: 800;
            color: #00ff88;
            letter-spacing: -0.5px;
        }

        .counter-wrap .label {
            font-size: 12px;
            color: #5a5f66;
            font-weight: 500;
            margin-left: 6px;
        }

        .counter-wrap .trend {
            color: #00ff88;
            font-size: 12px;
            margin-left: 8px;
        }

        /* Form */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #8a8f98;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .form-group label .req {
            color: #ff6b6b;
            font-size: 14px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #5a5f66;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: #fafafa;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            -webkit-appearance: none;
        }

        input:focus,
        textarea:focus {
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.04);
        }

        input::placeholder,
        textarea::placeholder {
            color: #4a4f56;
            font-weight: 300;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.6;
        }

        /* Send Button */
        .btn-send {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6, #ff0080);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            margin-top: 6px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-send::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.05) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-send:hover::after {
            transform: translateX(100%);
        }

        .btn-send:active {
            transform: scale(0.97);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-send .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-send .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Result */
        .result {
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 14px;
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.12);
            color: #00ff88;
        }

        .result.error {
            background: rgba(255, 0, 0, 0.06);
            border: 1px solid rgba(255, 0, 0, 0.12);
            color: #ff6b6b;
        }

        .result.loading {
            background: rgba(139, 92, 246, 0.06);
            border: 1px solid rgba(139, 92, 246, 0.12);
            color: #a78bfa;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #5a5f66;
        }

        .status-item .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-item .dot.green {
            background: #00ff88;
            animation: blinkLive 1.5s ease-in-out infinite;
        }

        .status-item .dot.purple {
            background: #8b5cf6;
            animation: blinkLive 2.2s ease-in-out infinite;
        }

        .status-item .val {
            color: #e8eaed;
            font-weight: 600;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 28px;
            padding: 0 8px;
        }

        .footer .disclaimer {
            font-size: 11px;
            color: #3a3f46;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        .footer .credit {
            font-size: 13px;
            color: #5a5f66;
            margin-top: 6px;
            font-weight: 500;
        }

        .footer .credit .heart {
            color: #ff0080;
            display: inline-block;
            animation: heartBeat 1.8s ease-in-out infinite;
        }

        .footer .credit .name {
            color: #8b5cf6;
            font-weight: 700;
        }

        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(1);
            }
            80% {
                transform: scale(1.1);
            }
        }

        .footer .version {
            font-size: 10px;
            color: #2a2f36;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .logo {
                font-size: 36px;
            }

            .card {
                padding: 20px 16px 18px;
                border-radius: 22px;
            }

            .card-title {
                font-size: 13px;
            }

            .card-badge {
                font-size: 8px;
                padding: 3px 10px;
            }

            .counter-wrap .num {
                font-size: 22px;
            }

            input,
            textarea {
                font-size: 14px;
                padding: 12px 14px;
            }

            .btn-send {
                font-size: 15px;
                padding: 14px;
                border-radius: 14px;
            }

            .badge {
                font-size: 8px;
                padding: 4px 10px;
            }

            .status-bar {
                gap: 4px;
            }

            .status-item {
                font-size: 10px;
            }

            .orb:nth-child(1) {
                width: 250px;
                height: 250px;
            }
            .orb:nth-child(2) {
                width: 200px;
                height: 200px;
            }
            .orb:nth-child(3) {
                width: 120px;
                height: 120px;
            }

            .tagline {
                font-size: 13px;
            }

            .divider-premium {
                width: 36px;
            }

            .header {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 380px) {
            .logo {
                font-size: 28px;
            }
            .card {
                padding: 16px 12px 14px;
            }
            .counter-wrap .num {
                font-size: 18px;
            }
            input,
            textarea {
                font-size: 13px;
                padding: 10px 12px;
            }
            .btn-send {
                font-size: 13px;
                padding: 12px;
            }
        }

        /* Touch feedback */
        @media (hover: none) {
            .btn-send:hover::after {
                transform: translateX(-100%);
            }
            .btn-send:active {
                transform: scale(0.96);
            }
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Selection */
        ::selection {
            background: rgba(139, 92, 246, 0.3);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="badge-wrap">
                <span class="badge"><span class="dot-live"></span> Live</span>
                <span class="badge pro">⚡ Pro</span>
                <span class="badge">🔒 SSL</span>
            </div>
            <h1 class="logo">SPOOFER</h1>
            <p class="tagline">Send emails from <span>any sender</span> you imagine</p>
            <div class="divider-premium"></div>
            <p class="edition-text">Samarth Pro Edition</p>
        </div>

           <!-- Card -->
        <div class="card">

            <!-- Card Header -->
            <div class="card-header">
                <div class="card-title">
                    <span class="icon">📧</span>
                    Compose
                    <span class="status-dot"></span>
                </div>
                <span class="card-badge">Secure</span>
            </div>

            <!-- Counter -->
            <div class="counter-wrap">
                <span class="num" id="counter">0</span>
                <span class="label">emails spoofed today</span>
                <span class="trend">↑</span>
            </div>

            <!-- Form -->
            <div class="form-group">
                <label>🎯 Recipient <span class="req">*</span></label>
                <input type="email" id="to" placeholder="target@example.com" autocomplete="off">
            </div>

            <div class="form-group">
                <label>🎭 Spoof Sender <span class="req">*</span></label>
                <input type="text" id="sender" placeholder="ceo@microsoft.com" autocomplete="off">
            </div>

            <div class="form-group">
                <label>📝 Subject <span class="req">*</span></label>
                <input type="text" id="subject" placeholder="Urgent: Board Meeting" autocomplete="off">
            </div>

            <div class="form-group">
                <label>💬 Message <span class="req">*</span></label>
                <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>
            </div>

            <!-- Send Button -->
            <button class="btn-send" id="sendBtn" onclick="sendEmail()">
                <span class="btn-content">
                    <span id="btnText">🚀 Send Email</span>
                    <span class="spinner" id="btnSpinner" style="display:none;"></span>
                </span>
            </button>

            <!-- Result -->
            <div id="result" class="result"></div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="dot green"></span>
                    <span>API <span class="val">Online</span></span>
                </div>
                <div class="status-item">
                    <span class="dot purple"></span>
                    <span>Encrypted</span>
                </div>
                <div class="status-item">
                    <span>🔒</span>
                    <span>Secure</span>
                </div>
                <div class="status-item">
                    <span>⚡</span>
                    <span>Fast</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p class="disclaimer">⚠️ For educational purposes only. Do not misuse.</p>
            <p class="credit">Developed with <span class="heart">❤️</span> by <span class="name">SAMARTH</span></p>
            <p class="version">v3.0 Pro • Premium Edition</p>
        </div>
    </div>

    <script>
        // Counter
        let count = parseInt(localStorage.getItem('spoofCount') || '0');
        document.getElementById('counter').textContent = count;

        const API_URL = '/api/send';

        function showResult(message, type) {
            const el = document.getElementById('result');
            el.textContent = message;
            el.className = 'result show ' + type;
        }

        function sendEmail() {
            const to = document.getElementById('to').value.trim();
            const sender = document.getElementById('sender').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!to || !sender || !subject || !message) {
                showResult('Please fill all fields', 'error');
                return;
            }

            const btn = document.getElementById('sendBtn');
            const text = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            text.textContent = 'Sending...';
            spinner.style.display = 'inline-block';
            btn.disabled = true;
            showResult('⏳ Sending...', 'loading');

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ to, sender, subject, message })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    count++;
                    localStorage.setItem('spoofCount', count);
                    document.getElementById('counter').textContent = count;
                    showResult('✅ Email sent! Check inbox (may be spam)', 'success');
                } else {
                    showResult('❌ Failed: ' + (data.error || 'Unknown'), 'error');
                }
            })
            .catch(() => showResult('❌ Server error. Try again.', 'error'))
            .finally(() => {
                text.textContent = '🚀 Send Email';
                spinner.style.display = 'none';
                btn.disabled = false;
            });
        }

        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                sendEmail();
            }
        });

        // Auto focus
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('to').focus();
        });

        // Haptic feedback for mobile
        if (navigator.vibrate) {
            document.querySelector('.btn-send').addEventListener('touchstart', () => {
                navigator.vibrate(8);
            });
        }
    </script>

</body>
</html>
